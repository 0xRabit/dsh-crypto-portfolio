- insert:
    # `name` must be the installed package name so Node resolution finds
    # the code (a relative path only works for local --patch overlays).
    - id: portfolio-tracker
      name: dsh-crypto-portfolio
      config:
        # Dashboard port; override in your profile patch or PORTFOLIO_PORT env.
        port: 8080
        host: 127.0.0.1
        # Where profiles (wallets, API keys, snapshot DB) are stored. Leave empty to
        # use the plugin's own directory, or point it somewhere durable so a plugin
        # update cannot touch your data. Also honoured: PORTFOLIO_PROFILES_DIR.
        dataDir: ""
